name: Validate spec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vectors:
    name: Validate test vectors
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact canonical fixtures
        run: python3 tools/vector_tool.py

